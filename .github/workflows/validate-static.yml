name: Validate AgriGIS static site

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            map.html
            dashboard.html
            news.html
            weather.html
            contact.html
            assets/css/style.css
            assets/js/app.js
            assets/js/map.js
            assets/js/dashboard.js
            sw.js
            manifest.webmanifest
            .nojekyll
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file" >&2; exit 1; }
          done

      - name: Reject Wayback runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'web-static\.archive\.org|web\.archive\.org|__wm\.|bundle-playback|wombat\.js' \
            --include='*.html' --include='*.css' --include='*.js' .; then
            echo 'Wayback/Archive runtime dependency detected.' >&2
            exit 1
          fi

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/app.js
          node --check assets/js/map.js
          node --check assets/js/dashboard.js
          node --check sw.js

      - name: Validate web manifest JSON
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool manifest.webmanifest >/dev/null

      - name: Summary
        run: |
          echo 'AgriGIS Hậu Giang static/offline source validation passed.'
