name: Deploy AgriGIS Hậu Giang to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static site
        shell: bash
        run: |
          test -f index.html
          test -f .nojekyll
          if grep -R -n -E 'web-static\.archive\.org|web\.archive\.org' \
            --include='*.html' --include='*.css' --include='*.js' .; then
            echo 'Wayback/Archive URL detected in runtime source.' >&2
            exit 1
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
